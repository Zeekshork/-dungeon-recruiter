<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demon Summoner: Knight Siege</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>Demon Summoner: Knight Siege</h1>
      <p>Summon demons, defend your altar, and crush the knight vanguard.</p>
    </header>

    <section class="hud" aria-label="Game stats">
      <div><span>Souls:</span> <strong id="souls">0</strong></div>
      <div><span>Wave:</span> <strong id="wave">1</strong></div>
      <div><span>Altar HP:</span> <strong id="altarHp">100</strong></div>
      <div><span>Knights Defeated:</span> <strong id="defeated">0</strong></div>
    </section>

    <section class="actions" aria-label="Summon controls">
      <button id="summonImp" title="Cost 10 souls">Summon Imp (10)</button>
      <button id="summonBrute" title="Cost 25 souls">Summon Brute (25)</button>
      <button id="startWave">Start Next Wave</button>
      <button id="restart" class="hidden">Restart</button>
    </section>

    <p id="message" role="status">Gather souls over time and prepare for battle.</p>

    <canvas id="battlefield" width="920" height="380" aria-label="battlefield"></canvas>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
